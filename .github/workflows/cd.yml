name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            artifact: "build/dev-macos-arm64"
          - platform: linux-x64
            os: ubuntu-latest
            artifact: "build/dev-linux-x64"
          - platform: windows-x64
            os: windows-latest
            artifact: "build/dev-win-x64"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Archive build (unix)
        if: runner.os != 'Windows'
        run: tar -czf one-click-deploy-${{ matrix.platform }}.tar.gz -C ${{ matrix.artifact }} .

      - name: Archive build (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.artifact }}/*" -DestinationPath "one-click-deploy-${{ matrix.platform }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-click-deploy-${{ matrix.platform }}
          path: one-click-deploy-${{ matrix.platform }}.*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
