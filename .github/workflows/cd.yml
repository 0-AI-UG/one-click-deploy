name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable per-commit tag for operator inspection and recovery.
            # The release step below deploys the build's immutable output digest.
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release panel
        if: github.ref == 'refs/heads/main'
        env:
          OCD_PANEL_URL: ${{ vars.OCD_PANEL_URL }}
          OCD_PANEL_RELEASE_SECRET: ${{ secrets.OCD_PANEL_RELEASE_SECRET }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ghcr.io/0-ai-ug/one-click-deploy
        run: |
          set -euo pipefail
          : "${OCD_PANEL_URL:?Configure the OCD_PANEL_URL repository variable}"
          : "${OCD_PANEL_RELEASE_SECRET:?Configure the OCD_PANEL_RELEASE_SECRET repository secret}"
          timestamp="$(date +%s)"
          payload="$(jq -cn \
            --arg image "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            --arg commit "${GITHUB_SHA}" \
            '{image: $image, commit: $commit}')"
          signature="$(printf '%s' "${timestamp}.${payload}" | python3 -c \
            'import hashlib, hmac, os, sys; print("sha256=" + hmac.new(os.environ["OCD_PANEL_RELEASE_SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "X-OCD-Timestamp: ${timestamp}" \
            --header "X-OCD-Signature-256: ${signature}" \
            --data "${payload}" \
            "${OCD_PANEL_URL%/}/webhooks/github/panel-release")"
          jq -e '.ok == true' <<<"${response}" >/dev/null
