name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            build_dir: "build/stable-macos-arm64"
          - platform: linux-x64
            os: ubuntu-latest
            build_dir: "build/stable-linux-x64"
          - platform: windows-x64
            os: windows-latest
            build_dir: "build/stable-win-x64"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx electrobun build --env=stable

      - name: Upload macOS DMG
        if: matrix.platform == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: one-click-deploy-macos-arm64
          path: ${{ matrix.build_dir }}/one-click-deploy.dmg

      - name: Upload Linux installer
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: one-click-deploy-linux-x64
          path: ${{ matrix.build_dir }}/one-click-deploy-Setup.tar.gz

      - name: Upload Windows installer
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: one-click-deploy-windows-x64
          path: ${{ matrix.build_dir }}/one-click-deploy-Setup.zip

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
