<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open CLI Deployment</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['Space Mono', 'monospace'],
            sans: ['DM Sans', 'sans-serif'],
          },
          colors: {
            bg: '#FFFDF5',
            'bg-raised': '#FFFFFF',
            alt: '#F0EBE1',
            fg: '#1A1A1A',
            'fg-dim': '#4A4A4A',
            muted: '#8A8A8A',
            accent: '#BAFF39',
            'accent-h': '#A8E830',
            'accent-blue': '#5B8DEF',
            'accent-red': '#FF4444',
            'accent-amber': '#FFB800',
            'accent-green': '#BAFF39',
          },
          boxShadow: {
            'neo': '4px 4px 0 #1A1A1A',
            'neo-sm': '2px 2px 0 #1A1A1A',
            'neo-lg': '5px 5px 0 #1A1A1A',
            'neo-none': '0 0 0 #1A1A1A',
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'pulse-slow': 'pulse 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          },
        },
      },
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html { zoom: 1.2; }
    body {
      background-color: #FFFDF5;
      color: #1A1A1A;
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1A1A1A; }
    /* Focus */
    :focus-visible { outline: 2px solid #BAFF39; outline-offset: 0; }
    /* Neo-brutalist inputs */
    input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
      background: #FFFFFF;
      border: 2px solid #1A1A1A;
      color: #1A1A1A;
      padding: 7px 10px;
      font: 400 10px/1.3 'Space Mono', monospace;
      outline: none;
      width: 100%;
      transition: box-shadow .1s, transform .1s;
    }
    input:focus, select:focus, textarea:focus {
      box-shadow: 2px 2px 0 #1A1A1A;
      transform: translate(-1px, -1px);
    }
    input::placeholder, textarea::placeholder { color: #8A8A8A; }
    select { cursor: pointer; appearance: none; }
    /* Checkbox — brutalist style */
    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 16px; height: 16px; min-width: 16px;
      border: 2px solid #1A1A1A; background: #FFFFFF;
      cursor: pointer; position: relative; display: inline-block; vertical-align: middle;
    }
    input[type="checkbox"]:checked { background: #BAFF39; }
    input[type="checkbox"]:checked::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; background: #1A1A1A;
    }
    input[type="checkbox"]:hover { background: #F0EBE1; }
    input[type="checkbox"]:checked:hover { background: #A8E830; }
    /* Animations */
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    .spin { animation: spin .6s linear infinite; }
    /* Rocket takeoff */
    @keyframes flame-flicker {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50%      { transform: scaleY(0.78) scaleX(1.12); }
    }
    @keyframes smoke-drift {
      0%   { transform: translateY(0) scale(1);   opacity: 0; }
      30%  { opacity: 0.6; }
      100% { transform: translateY(8px) scale(1.6); opacity: 0; }
    }
    .group:hover .flame-flicker { animation: flame-flicker 0.18s ease-in-out infinite; transform-origin: top center; }
    .group:hover .smoke-puff    { animation: smoke-drift 0.9s ease-out infinite; }

    /* Phone UI has its own component tree. These rules provide the native-feeling
       viewport, safe areas and input sizing that the mobile components build on. */
    @media (max-width: 767px) {
      html { zoom: 1; }
      body {
        font-size: 14px;
        padding-bottom: calc(62px + env(safe-area-inset-bottom));
        overscroll-behavior-y: none;
      }
      button, a { -webkit-tap-highlight-color: transparent; }
      input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
        min-height: 44px;
        padding: 10px 12px;
        font-size: 16px;
      }
      input[type="checkbox"] { width: 22px; height: 22px; min-width: 22px; }
      input[type="checkbox"]:checked::after { top: 3px; left: 3px; width: 12px; height: 12px; }
      ::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="./src/index.tsx"></script>
</body>
</html>
